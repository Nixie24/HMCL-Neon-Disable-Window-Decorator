name: Release HMCL CE Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: hmclce-plugin-release-${{ github.repository }}
  cancel-in-progress: false

env:
  HMCL_VERSION: 26.8-release.2

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Resolve release tag
        run: |
          echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download HMCL jar
        run: |
          set -euo pipefail
          mkdir -p lib
          curl -fsSL --retry 3 \
            -o "lib/HMCL-CE-${HMCL_VERSION}.jar" \
            "https://github.com/HMCL-Community/HMCL-Neon/releases/download/v${HMCL_VERSION}/HMCL-CE-${HMCL_VERSION}.jar"

      - name: Build NPL
        run: ./gradlew --no-daemon packageNpl

      - name: Validate package and generate manifest
        id: pkg
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path build/npl -Filter *.npl -File -Recurse)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one .npl package, found $($packages.Count)."
          }
          $package = $packages[0]
          $version = $env:RELEASE_TAG -replace '^v', ''
          $packageUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($package.Name)"
          ./tools/validate-npl.ps1 -Package $package.FullName
          ./tools/sign-plugin.ps1 `
            -Manifest ./manifest.template.json `
            -Output ./manifest.json `
            -Package $package.FullName `
            -PackageUrl $packageUrl `
            -Version $version `
            -Community
          ./tools/validate-npl.ps1 -Package $package.FullName -StoreManifest ./manifest.json
          "file=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "size=$($package.Length)" >> $env:GITHUB_OUTPUT

      - name: Create or update draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pkg.outputs.file }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_SHA256: ${{ steps.pkg.outputs.sha256 }}
          PACKAGE_SIZE: ${{ steps.pkg.outputs.size }}
        run: |
          set -euo pipefail

          # Draft releases are not returned by /releases/tags/{tag}; list and filter instead.
          releases_json="$RUNNER_TEMP/hmclce-releases.json"

          fetch_releases() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_json"
          }

          find_release() {
            jq -c --arg tag "$RELEASE_TAG" 'map(select(.tag_name == $tag)) | .[0] // empty' "$releases_json"
          }

          asset_count() {
            jq --arg name "$PACKAGE_NAME" '[.assets[] | select(.name == $name)] | length' <<<"$1"
          }

          fetch_releases
          release="$(find_release)"

          if [ -n "$release" ] && [ "$(jq -r '.draft' <<<"$release")" != "true" ]; then
            echo "::error::A published release already exists for $RELEASE_TAG; published NPL bytes are immutable."
            exit 1
          fi

          if [ -z "$release" ]; then
            # Create through the REST API: the response is the new release itself, so
            # this does not depend on the release list catching up (it is eventually
            # consistent, which made a just-created draft look missing).
            release="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$RELEASE_TAG" \
              -F draft=true \
              -f body='Community release pending manifest publication.')"
          fi

          release_id="$(jq -r '.id' <<<"$release")"
          count="$(asset_count "$release")"
          if [ "$count" -gt 1 ]; then
            echo "::error::Draft release contains duplicate NPL assets named $PACKAGE_NAME."
            exit 1
          fi

          if [ "$count" -eq 1 ]; then
            asset_id="$(jq -r --arg name "$PACKAGE_NAME" '[.assets[] | select(.name == $name)][0].id' <<<"$release")"
            asset_size="$(jq -r --arg name "$PACKAGE_NAME" '[.assets[] | select(.name == $name)][0].size' <<<"$release")"
            if [ "$asset_size" != "$PACKAGE_SIZE" ]; then
              echo "::error::Existing NPL asset is $asset_size bytes, local package is $PACKAGE_SIZE bytes; refusing to replace immutable release bytes."
              exit 1
            fi
            existing_npl="$RUNNER_TEMP/hmclce-existing-$asset_id.npl"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$existing_npl"
            remote_sha256="$(sha256sum "$existing_npl" | cut -d' ' -f1)"
            if [ "$remote_sha256" != "$PACKAGE_SHA256" ]; then
              echo "::error::Existing NPL asset sha256 $remote_sha256 differs from local $PACKAGE_SHA256; refusing to replace immutable release bytes."
              exit 1
            fi
            echo "Reusing byte-identical draft NPL asset $asset_id."
          else
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --repo "$GITHUB_REPOSITORY"
            assets_json="$RUNNER_TEMP/hmclce-assets.json"
            count=0
            for attempt in $(seq 1 10); do
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > "$assets_json"
              count="$(jq --arg name "$PACKAGE_NAME" '[.[] | select(.name == $name)] | length' "$assets_json")"
              if [ "$count" -eq 1 ]; then
                break
              fi
              sleep 3
            done
            if [ "$count" -ne 1 ]; then
              echo "::error::NPL asset did not appear on release $release_id after upload."
              exit 1
            fi
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" ./manifest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish manifest on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          generated_manifest="$RUNNER_TEMP/hmclce-manifest.json"
          cp manifest.json "$generated_manifest"
          git fetch origin "$DEFAULT_BRANCH"
          # manifest.json is generated, not tracked in the tag checkout; drop it so
          # the checkout cannot be blocked by an untracked file on later runs.
          rm -f manifest.json
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$generated_manifest" manifest.json
          # `git diff` says nothing about an untracked file, so only claim the
          # manifest is current when it actually exists on the default branch.
          if git cat-file -e "origin/$DEFAULT_BRANCH:manifest.json" 2>/dev/null \
            && git diff --quiet "origin/$DEFAULT_BRANCH" -- manifest.json; then
            echo "Default-branch manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish HMCL CE plugin ${RELEASE_TAG}"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          PACKAGE_SHA256: ${{ steps.pkg.outputs.sha256 }}
          PACKAGE_SIZE: ${{ steps.pkg.outputs.size }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_ID:-}" ]; then
            echo "::error::Draft release id is missing."
            exit 1
          fi
          notes="$(printf 'SHA-256: %s\nSize: %s bytes\n' "$PACKAGE_SHA256" "$PACKAGE_SIZE")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f body="$notes" > /dev/null
